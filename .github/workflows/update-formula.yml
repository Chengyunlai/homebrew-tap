name: Update Formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Generate Formula
        run: python scripts/update_formula.py
      - name: Commit update
        id: commit
        shell: bash
        run: |
          git add Formula/ops-agent.rb
          if git diff --cached --quiet; then
            echo "Formula already matches the latest release."
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name yun
          git config user.email \
            "58059527+Chengyunlai@users.noreply.github.com"
          version="$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/ops-agent.rb)"
          git commit -m "chore: update ops-agent to ${version}"
          git push
          echo "changed=true" >>"${GITHUB_OUTPUT}"
      - name: Validate updated Formula
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
