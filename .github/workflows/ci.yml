name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check generator
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests

  formula:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          stable: true
      - name: Install Formula
        run: brew install Chengyunlai/tap/ops-agent
      - name: Test installed commands
        shell: bash
        run: |
          brew test Chengyunlai/tap/ops-agent
          version="$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/ops-agent.rb)"
          test "$(ops-agent --version)" = "ops-agent ${version}"
          test "$(ops_agent --version)" = "ops-agent ${version}"
